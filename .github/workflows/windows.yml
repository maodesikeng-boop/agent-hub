name: windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/daemon/platform/**"
      - "src/daemon/driver/**"
      - "src/daemon/agent-api/**"
      - "src/daemon/git/**"
      - "src/daemon/ledger/**"
      - "src/daemon/vendor-sync/**"
      - "src/daemon/run-socket.ts"
      - "src/daemon/worktree-cleanup.ts"
      - "src/hub/**"
      - "src/shared/paths.ts"
      - "src/shared/readonly-policy.ts"
      - "src/shared/write-scope.ts"
      - "src/vendors/**"
      - "apps/windows/**"
      - "test/windows/**"
      - ".github/workflows/windows.yml"
  push:
    branches: [main]
    paths:
      - "src/daemon/platform/**"
      - "src/daemon/driver/**"
      - "src/daemon/agent-api/**"
      - "src/daemon/git/**"
      - "src/daemon/ledger/**"
      - "src/daemon/vendor-sync/**"
      - "src/daemon/run-socket.ts"
      - "src/daemon/worktree-cleanup.ts"
      - "src/hub/**"
      - "src/shared/paths.ts"
      - "src/shared/readonly-policy.ts"
      - "src/shared/write-scope.ts"
      - "src/vendors/**"
      - "apps/windows/**"
      - "test/windows/**"
      - ".github/workflows/windows.yml"

concurrency:
  group: windows-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-helper-and-integration:
    name: windows (fusa-win-helper & integration)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Enable git core.longpaths
        run: git config --global core.longpaths true

      - name: Ensure second NTFS volume exists for cross-volume worktree tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sysDrive = (Get-Item $env:TEMP).PSDrive.Name + ":\"
          $other = Get-PSDrive -PSProvider FileSystem | Where-Object { ($_.Root -ne $sysDrive) -and (Test-Path $_.Root) } | Select-Object -First 1
          if ($other) {
            Write-Host "Found existing second volume: $($other.Root)"
            "FUSA_CI_SECOND_VOLUME=$($other.Root)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            $vhdPath = "C:\fusa-ci-second-vol.vhdx"
            $dpScript = @(
              "create vdisk file=`"$vhdPath`" maximum=2048 type=expandable",
              "select vdisk file=`"$vhdPath`"",
              "attach vdisk",
              "create partition primary",
              "format fs=ntfs label=FusaCiVol quick",
              "assign letter=V"
            ) -join "`r`n"
            $dpFile = Join-Path $env:TEMP "fusa-create-vhdx.txt"
            Set-Content -LiteralPath $dpFile -Value $dpScript -Encoding ascii
            diskpart /s $dpFile
            "FUSA_CI_SECOND_VOLUME=V:\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Mounted NTFS VHDX at V:\"
          }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.vite
          key: node-modules-v2-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows -> target

      - name: Test and build fusa-win-helper
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo test --manifest-path apps/windows/Cargo.toml -p fusa-win-helper --locked
          cargo build --release --manifest-path apps/windows/Cargo.toml -p fusa-win-helper --locked

      - name: Smoke probe fusa-run.exe sandbox
        shell: pwsh
        run: |
          $helperDir = Join-Path $PWD "apps\windows\target\release"
          "AGENT_HUB_WIN_HELPERS=$helperDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $diagDir = Join-Path $env:TEMP "fusa-win-diag"
          New-Item -ItemType Directory -Force -Path $diagDir | Out-Null
          "FUSA_WIN_DIAG_DIR=$diagDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $helperDir "fusa-run.exe") probe

      - name: Upload built fusa-win-helper binaries for vitest shards
        uses: actions/upload-artifact@v4
        with:
          name: fusa-win-helper-bins
          path: |
            apps/windows/target/release/fusa-run.exe
            apps/windows/target/release/hub.exe
          if-no-files-found: error
          retention-days: 1

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Windows real-OS integration tests (test/windows)
        run: pnpm exec vitest run --project=node test/windows --reporter=verbose --reporter=github-actions --reporter=junit --outputFile.junit=vitest-windows-integration.xml

      - name: Upload Windows integration diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-integration-diagnostics
          path: |
            vitest-windows-integration.xml
            ${{ runner.temp }}/fusa-win-diag/**
          if-no-files-found: ignore

  windows-vitest-node:
    name: windows vitest (node ${{ matrix.shard }})
    needs: windows-helper-and-integration
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v5

      - name: Enable git core.longpaths
        run: git config --global core.longpaths true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.vite
          key: node-modules-v2-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Download built fusa-win-helper binaries
        uses: actions/download-artifact@v4
        with:
          name: fusa-win-helper-bins
          path: apps/windows/target/release

      - name: Export AGENT_HUB_WIN_HELPERS
        shell: pwsh
        run: |
          $helperDir = Join-Path $PWD "apps\windows\target\release"
          "AGENT_HUB_WIN_HELPERS=$helperDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run node vitest shard
        run: pnpm exec vitest run --project=node --shard=${{ matrix.shard }} --reporter=verbose --reporter=github-actions --reporter=junit --outputFile.junit=vitest-junit-win.xml

      - name: Upload vitest diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit-windows-${{ strategy.job-index }}
          path: vitest-junit-win.xml
          if-no-files-found: ignore
