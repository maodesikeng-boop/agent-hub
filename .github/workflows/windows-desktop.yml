name: windows-desktop

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/windows/**"
      - "apps/desktop/**"
      - "src/daemon/**"
      - "src/shared/**"
      - "src/vendors/**"
      - "src/hub/**"
      - "scripts/stage-win-runtime.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/windows-desktop.yml"
  push:
    branches: [main]
    paths:
      - "apps/windows/**"
      - "apps/desktop/**"
      - "src/daemon/**"
      - "src/shared/**"
      - "src/vendors/**"
      - "src/hub/**"
      - "scripts/stage-win-runtime.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/windows-desktop.yml"

concurrency:
  group: windows-desktop-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-nsis:
    name: windows-desktop (native x64 NSIS & self-test)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Enable git core.longpaths
        run: git config --global core.longpaths true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build web frontend assets
        run: pnpm build

      - name: Install Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows -> target

      - name: Run Rust workspace unit tests
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --manifest-path apps/windows/Cargo.toml --workspace --locked

      - name: Build fusa-win-helper and fusa-desktop release binaries
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --release --manifest-path apps/windows/Cargo.toml --workspace --bins --locked

      - name: Stage native runtime (official Node 24 LTS SHA-256 + hoisted daemon node_modules + helpers)
        run: >-
          node scripts/stage-win-runtime.ts
          --out-dir apps/windows/crates/fusa-desktop/staged-runtime
          --helpers-dir apps/windows/target/release
          --target-os win32

      - name: Run portable fusa-desktop.exe --self-test (headless end-to-end verification)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $portableDir = Join-Path $env:RUNNER_TEMP "fusa-portable-selftest"
          if (Test-Path $portableDir) {
            Remove-Item -Recurse -Force $portableDir
          }
          Copy-Item -Recurse -Path "apps\windows\crates\fusa-desktop\staged-runtime" -Destination $portableDir
          Copy-Item -Path "apps\windows\target\release\fusa-desktop.exe" -Destination (Join-Path $portableDir "fusa-desktop.exe")
          & (Join-Path $portableDir "fusa-desktop.exe") --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "fusa-desktop.exe --self-test exited with non-zero code $LASTEXITCODE"
          }
          Remove-Item -Recurse -Force $portableDir

      - name: Build Tauri NSIS installer (currentUser, unsigned-preview)
        working-directory: apps/windows/crates/fusa-desktop
        env:
          CI: "true"
        run: pnpm dlx @tauri-apps/cli@^2 build --bundles nsis --ci --config tauri.bundle.conf.json -- --locked

      - name: Verify NSIS installer size budget (<= 60 MiB), label unsigned-preview and generate SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nsisDir = "apps/windows/target/release/bundle/nsis"
          $setupExe = Get-ChildItem -Path $nsisDir -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setupExe) {
            throw "NSIS installer executable not found under $nsisDir"
          }

          $cargoToml = Get-Content -Raw "apps/windows/Cargo.toml"
          if ($cargoToml -match 'version\s*=\s*"([^"]+)"') {
            $version = $Matches[1]
          } else {
            $version = "0.1.0"
          }

          $outDir = "apps/windows/target/release/unsigned-preview-artifacts"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $previewName = "Fusa_${version}_x64-setup-unsigned-preview.exe"
          $previewPath = Join-Path $outDir $previewName
          Copy-Item -Path $setupExe.FullName -Destination $previewPath -Force

          $hash = (Get-FileHash -Path $previewPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $previewName" | Set-Content -Encoding ascii -NoNewline:$false -Path "$previewPath.sha256"

          $exactBytes = (Get-Item $previewPath).Length
          $sizeMiB = [math]::Round($exactBytes / 1MB, 2)
          $budgetBytes = 60 * 1024 * 1024
          Write-Host "NSIS installer: $previewName | exactBytes=$exactBytes | sizeMiB=$sizeMiB MiB | budget=60 MiB | sha256=$hash"
          if ($exactBytes -gt $budgetBytes) {
            throw "NSIS installer exceeded 60 MiB budget: $exactBytes bytes ($sizeMiB MiB)"
          }

      - name: Upload unsigned-preview NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fusa-windows-x64-nsis-unsigned-preview
          path: apps/windows/target/release/unsigned-preview-artifacts/*
          if-no-files-found: error
          retention-days: 14
