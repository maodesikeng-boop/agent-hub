name: nightly

# Runs the full suite on an unchanged main every night at 23:00 Beijing time (15:00 UTC) so flaky tests show up
# without a new change to blame. Failed tests print as "FAIL |<project>| <file> > <suite> > <test>" in the job log.
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    uses: ./.github/workflows/check.yml

  windows:
    uses: ./.github/workflows/windows.yml

  macos:
    uses: ./.github/workflows/macos.yml
