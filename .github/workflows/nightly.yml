name: nightly

# Runs the full suite on an unchanged main every night at 22:17 Beijing time (14:17 UTC, off the top of the hour
# to avoid GitHub schedule queue delays) so flaky tests show up without a new change to blame. Failed tests
# print as "FAIL |<project>| <file> > <suite> > <test>" in the job log.
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/check.yml

  windows:
    uses: ./.github/workflows/windows.yml

  macos:
    uses: ./.github/workflows/macos.yml
