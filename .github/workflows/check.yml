name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: check-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # pnpm 10 does not run dependency install scripts unless approved
      # (onlyBuiltDependencies); none are approved here.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # 不用 pnpm check：它的 dot reporter 在 CI 里跑整套时看不到点、失败汇总和统计（只剩 stderr），
      # 一条用例失败也只看到 exit code 1。test:ci 用 verbose + github-actions，失败写成注解。
      - run: pnpm test:ci

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vitest-junit
          path: vitest-junit.xml
          if-no-files-found: ignore

      - run: pnpm build
