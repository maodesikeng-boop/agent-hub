name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: check-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Mac 测试在开发机本地跑；云端 CI 只跑 Ubuntu，并按 4 路 shard 并行分片 + 缓存 node_modules 提速。
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    name: check (ubuntu ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.vite
          key: node-modules-v2-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}

      # pnpm 10 does not run dependency install scripts unless approved
      # (onlyBuiltDependencies); none are approved here.
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: matrix.shard == '1/4'
        run: pnpm typecheck

      # 沙箱依赖（bubblewrap/socat）的安装：先走 actions/cache 缓存的 .deb，缓存没命中再 apt 在线装；
      # runner 默认的 Azure 镜像连不上时自动切到 Ubuntu 官方源重试。装好后 scripts/linux-sandbox-setup.sh
      # 看到 bwrap/socat 已存在就会跳过它自己的 apt 步骤（脚本本身不用改，用户机器上的行为不变）。
      - name: Runner image version (apt cache key)
        id: runner-image
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache apt debs (bubblewrap, socat)
        id: cache-apt-debs
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-debs-v1-fbtest-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}

      - name: TEMP simulate azure mirror outage
        run: |
          echo "192.0.2.1 azure.archive.ubuntu.com" | sudo tee -a /etc/hosts

      - name: Install sandbox apt packages (cache, then apt with fallback mirror)
        env:
          APT_DEBS_CACHE_HIT: ${{ steps.cache-apt-debs.outputs.cache-hit }}
        run: |
          set -uo pipefail
          export DEBIAN_FRONTEND=noninteractive
          DEBS="$HOME/apt-debs"

          echo "::group::apt 源诊断（runner 实际用的源）"
          cat /etc/apt/apt-mirrors.txt 2>&1 || true
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
            [ -f "$f" ] && { echo "--- $f"; cat "$f"; }
          done
          echo "::endgroup::"

          if command -v bwrap >/dev/null 2>&1 && command -v socat >/dev/null 2>&1; then
            echo "bwrap/socat 已存在，跳过安装"
            exit 0
          fi

          # 1) 缓存命中：直接用缓存的 .deb 离线安装，不碰任何镜像
          if [ "$APT_DEBS_CACHE_HIT" = "true" ] && ls "$DEBS"/*.deb >/dev/null 2>&1; then
            if sudo dpkg -i "$DEBS"/*.deb; then
              echo "apt-debs 缓存命中，已离线安装 bubblewrap/socat"
              exit 0
            fi
            echo "::warning::缓存的 .deb 安装失败，改走在线安装"
          fi

          # 2) 在线安装；失败时把源切到 Ubuntu 官方源再试
          apt_install() {
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -y &&
              sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
                -o APT::Keep-Downloaded-Packages=true install -y bubblewrap socat
          }

          if ! apt_install; then
            echo "::warning::默认镜像（mirror+file:/etc/apt/apt-mirrors.txt → azure.archive.ubuntu.com）不可用，切换到 archive.ubuntu.com / security.ubuntu.com 重试"
            # 24.04 是 deb822 的 *.sources，22.04 及以前是 sources.list；两种都改。
            # mirror+file:... 与 azure.archive 一律换成官方 archive；security 本来就是 security.ubuntu.com。
            sudo sed -i -E \
              -e 's#mirror\+file:/etc/apt/apt-mirrors\.txt#http://archive.ubuntu.com/ubuntu/#g' \
              -e 's#https?://azure\.archive\.ubuntu\.com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
            echo "::group::改写后的源"
            grep -rhE '^(URIs|deb )' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null || true
            echo "::endgroup::"
            sudo rm -rf /var/lib/apt/lists/*
            apt_install || { echo "::error::官方源也装不上 bubblewrap/socat"; exit 1; }
            echo "已通过官方源（archive.ubuntu.com）装好 bubblewrap/socat"
          fi

          # 3) 装成功后把下载过的 .deb 留给 actions/cache 保存（job 成功才会保存）
          mkdir -p "$DEBS"
          sudo cp -n /var/cache/apt/archives/*.deb "$DEBS"/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$DEBS"
          ls -l "$DEBS"

      - name: Setup Linux bubblewrap sandbox
        run: sudo bash scripts/linux-sandbox-setup.sh

      # 不用 pnpm check：它的 dot reporter 在 CI 里跑整套时看不到点、失败汇总和统计（只剩 stderr），
      # 一条用例失败也只看到 exit code 1。test:ci 用 verbose + github-actions，失败写成注解。
      - run: pnpm test:ci --shard=${{ matrix.shard }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vitest-junit-ubuntu-${{ strategy.job-index }}
          path: vitest-junit.xml
          if-no-files-found: ignore

      - name: Build
        if: matrix.shard == '1/4'
        run: pnpm build
