name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: check-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # pnpm 10 does not run dependency install scripts unless approved
      # (onlyBuiltDependencies); none are approved here.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # CI 里不用 pnpm check 的 dot reporter：它在 CI 日志里看不到失败汇总（见 PR 说明），
      # 改用 verbose（逐条用例 + 耗时）、github-actions（失败写成注解）、junit（留档）。
      - run: pnpm vitest run --exclude test/tmp-dot-probe.test.ts --reporter=verbose --reporter=github-actions --reporter=junit --outputFile.junit=vitest-junit.xml

      - name: probe dot reporter
        if: matrix.rep == 1
        continue-on-error: true
        run: pnpm check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-junit-${{ matrix.rep }}
          path: vitest-junit.xml
          if-no-files-found: ignore

      - run: pnpm build
