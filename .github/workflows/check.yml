name: check

on:
  # nightly.yml reuses the full suite.
  workflow_call:
  # No path filter on pull requests: branch protection requires these checks, and a skipped workflow never reports.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "README.zh-CN.md"
      - "SECURITY.md"
      - "LICENSE"
      - "docs/**"

# Pull requests cancel superseded runs; every main commit gets its own group so a later merge never cancels or replaces it.
concurrency:
  group: check-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    # Mac 测试在开发机本地跑；云端 CI 只跑 Ubuntu，并按 4 路 shard 并行分片 + 缓存 node_modules 提速。
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    name: check (ubuntu ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.vite
          key: node-modules-v2-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}

      # pnpm 10 does not run dependency install scripts unless approved
      # (onlyBuiltDependencies); none are approved here.
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: matrix.shard == '1/4'
        run: pnpm typecheck

      - name: Lint
        if: matrix.shard == '1/4'
        run: pnpm lint

      - name: Install sandbox apt packages
        uses: ./.github/actions/apt-install
        timeout-minutes: 7
        with:
          cache-id: sandbox
          probe: command -v bwrap && command -v socat
          install: timeout 115 apt-get update && timeout 115 apt-get install -y bubblewrap socat

      - name: Setup Linux bubblewrap sandbox
        run: sudo bash scripts/linux-sandbox-setup.sh

      # 不用 pnpm check：它的 dot reporter 在 CI 里跑整套时看不到点、失败汇总和统计（只剩 stderr），
      # 一条用例失败也只看到 exit code 1。test:ci 用 verbose + github-actions，失败写成注解。
      - run: pnpm test:ci --shard=${{ matrix.shard }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vitest-junit-ubuntu-${{ strategy.job-index }}
          path: vitest-junit.xml
          if-no-files-found: ignore

      - name: Build
        if: matrix.shard == '1/4'
        run: pnpm build

  migration-claims:
    name: migration-claims
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: github.event_name == 'pull_request'
      - uses: actions/setup-node@v5
        if: github.event_name == 'pull_request'
        with:
          node-version: 24
          cache: pnpm
      - name: Cache node_modules
        id: cache-node-modules
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.vite
          key: node-modules-v2-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies
        if: github.event_name == 'pull_request' && steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Check migration claims
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/migration-claims.ts --pr "$PR_NUMBER"

  verify-smoke:
    name: verify-smoke (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.vite
          key: node-modules-v2-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright apt packages
        uses: ./.github/actions/apt-install
        timeout-minutes: 7
        with:
          cache-id: playwright-chromium-webkit-${{ hashFiles('pnpm-lock.yaml') }}
          probe: pnpm exec playwright install-deps --dry-run chromium webkit
          install: pnpm exec playwright install-deps chromium webkit

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium webkit

      - name: Run pnpm verify
        run: pnpm verify --composer-layout --out "$RUNNER_TEMP/verify-smoke"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-verify-smoke
          path: ${{ runner.temp }}/verify-smoke
          if-no-files-found: ignore
          retention-days: 14
