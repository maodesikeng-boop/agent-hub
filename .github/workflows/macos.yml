name: macos

# Full suite on macOS. nightly.yml runs it on main every night and release.yml runs it on every release candidate commit.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    name: macos (${{ matrix.shard }})
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - run: pnpm test:ci --shard=${{ matrix.shard }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vitest-junit-macos-${{ strategy.job-index }}
          path: vitest-junit.xml
          if-no-files-found: ignore
