name: Install Ubuntu apt packages
description: Restore cached debs, then try the runner mirror and the Ubuntu archive.
inputs:
  cache-id:
    description: Identifies the package set, including a dependency hash if the set changes with the lockfile.
    required: true
  probe:
    description: Shell command that succeeds when all packages are installed.
    required: true
  install:
    description: Shell command that installs the packages as root.
    required: true

runs:
  using: composite
  steps:
    - name: Read the runner image and base package fingerprint
      id: image
      shell: bash
      run: |
        set -euo pipefail
        hash_cmd() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum
          else
            shasum -a 256
          fi
        }
        dpkg_hash="$(dpkg-query -W -f='${Package}:${Architecture}=${Version}\n' | LC_ALL=C sort | hash_cmd | awk '{print substr($1, 1, 16)}')"
        {
          echo "os=${ImageOS:-unknown}"
          echo "version=${ImageVersion:-unknown}"
          echo "dpkg_hash=${dpkg_hash}"
        } >> "$GITHUB_OUTPUT"

    - name: Cache apt packages
      id: cache
      if: steps.image.outputs.version != 'unknown'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/apt-debs-${{ inputs.cache-id }}
        key: apt-debs-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.os }}-${{ steps.image.outputs.version }}-${{ steps.image.outputs.dpkg_hash }}-${{ inputs.cache-id }}

    - name: Install from cache or apt
      shell: bash
      env:
        DEBS: ${{ runner.temp }}/apt-debs-${{ inputs.cache-id }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        PROBE: ${{ inputs.probe }}
        INSTALL: ${{ inputs.install }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        APT_SOURCES_ROOT="${APT_SOURCES_ROOT:-/etc/apt}"
        APT_ARCHIVES_DIR="${APT_ARCHIVES_DIR:-/var/cache/apt/archives}"
        if timeout 15 bash -c "$PROBE"; then
          echo "Required packages are already installed"
          exit 0
        fi

        debs=("$DEBS"/*.deb)
        if [[ "${CACHE_HIT:-}" == true ]] && (( ${#debs[@]} > 0 )); then
          if sudo timeout --kill-after=5s 60 env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-download --no-install-recommends "${debs[@]}" && timeout 15 bash -c "$PROBE"; then
            echo "Installed packages from cached debs"
            exit 0
          fi
          echo "::warning::Cached debs did not install all packages; trying apt"
        fi

        apt_config="$(mktemp)"
        trap 'rm -f "$apt_config"' EXIT
        cat > "$apt_config" <<APT
        Acquire::Retries "1";
        Acquire::http::Timeout "15";
        Acquire::https::Timeout "15";
        APT::Keep-Downloaded-Packages "true";
        APT
        repair_dpkg() {
          if [[ -n "$(dpkg --audit 2>/dev/null || true)" ]]; then
            echo "::warning::dpkg database is dirty after cached install; repairing before apt"
            sudo timeout --kill-after=5s 60 env DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true
            if [[ -n "$(dpkg --audit 2>/dev/null || true)" ]]; then
              sudo timeout --kill-after=5s 120 env APT_CONFIG="$apt_config" DEBIAN_FRONTEND=noninteractive apt-get update || return 1
              sudo timeout --kill-after=5s 120 env APT_CONFIG="$apt_config" DEBIAN_FRONTEND=noninteractive apt-get install -y --fix-broken --no-install-recommends || return 1
            fi
          fi
        }
        install_packages() {
          sudo timeout --kill-after=5s 120 env "PATH=$PATH" APT_CONFIG="$apt_config" DEBIAN_FRONTEND=noninteractive bash -e -c "$INSTALL"
        }
        run_online_install() {
          repair_dpkg && install_packages
        }

        if ! run_online_install; then
          echo "::warning::Runner apt mirror failed; retrying with archive.ubuntu.com"
          sources=("$APT_SOURCES_ROOT"/sources.list.d/*.sources "$APT_SOURCES_ROOT"/sources.list.d/*.list)
          if [[ -f "$APT_SOURCES_ROOT/sources.list" ]]; then
            sources+=("$APT_SOURCES_ROOT/sources.list")
          fi
          if (( ${#sources[@]} > 0 )); then
            sudo sed -i -E \
              -e 's#mirror\+file:/etc/apt/apt-mirrors\.txt#http://archive.ubuntu.com/ubuntu/#g' \
              -e 's#https?://([a-z0-9.-]+\.)?azure\.archive\.ubuntu\.com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#g' \
              -e 's#https?://([a-z0-9.-]+\.)?ec2\.archive\.ubuntu\.com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#g' \
              "${sources[@]}"
          fi
          run_online_install
        fi

        timeout 15 bash -c "$PROBE"
        archives=("$APT_ARCHIVES_DIR"/*.deb)
        if (( ${#archives[@]} > 0 )); then
          rm -rf "$DEBS"
          mkdir -p "$DEBS"
          cp "${archives[@]}" "$DEBS"/
          echo "Saved ${#archives[@]} debs for the next run"
        fi
