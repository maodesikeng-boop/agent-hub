[workspace]
resolver = "2"
members = ["crates/fusa-wsl", "crates/fusa-supervisor", "crates/fusa-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.15"
ureq = { version = "3.5", default-features = false }
url = "2.5"
winreg = "0.56"
tauri = { version = "2.12", features = ["tray-icon", "image-png", "image-ico"] }
tauri-build = "2.7"
