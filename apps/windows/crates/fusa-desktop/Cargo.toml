[package]
name = "fusa-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri 2 Windows desktop shell, bootstrap setup view, and system tray for Fusa"

[lib]
name = "fusa_desktop"
path = "src/lib.rs"

[[bin]]
name = "fusa-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
fusa-wsl = { path = "../fusa-wsl" }
fusa-supervisor = { path = "../fusa-supervisor" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
